spring:
  application:
    name: QuoteOn

  datasource:
    url: jdbc:mysql://localhost:3306/quoteon_db?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# SMTP 접속값은 환경 변수로만 받는다. 값이 없으면 애플리케이션은 기동되고, 발송 요청만 실패한다.
quoteon:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    smtp-auth: ${MAIL_PROPERTIES_MAIL_SMTP_AUTH:}
    starttls-enable: ${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:}

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
